name: Check published site

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'
      - name: Check generated files
        run: node scripts/build.cjs --check
      - name: Check routes and static entry points
        run: |
          node tests/routes.test.cjs
          node tests/router-integration.test.cjs
          node tests/static-routes.test.cjs
      - name: Check audio behavior
        run: node tests/audio-regression.cjs index.html
      - name: Check casting and foundry clearance
        run: |
          node tests/casting-liquid.test.cjs
          node tests/foundry-clearance.test.cjs
      - name: Check pipe ignition
        run: node tests/ignition.test.cjs
      - name: Check scene and browser runtime
        run: node tests/runtime-regression.cjs
